# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".
# Purpose: Regenerate and commit the code index on push to main.

name: codeindex
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  codeindex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Find changed files
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |-
          run=true
          zero="0000000000000000000000000000000000000000"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            sources=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'src/*.ts' 'src/*.tsx')
            if grep -q "^[.]xss/" <<< "$changed"; then
              echo "The push already changes .xss/; not regenerating the code index."
              run=false
            elif [ -z "$sources" ]; then
              echo "The push changes no source file; not regenerating the code index."
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        id: setup_node
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        id: install_dependencies
        if: steps.changes.outputs.run == 'true'
        run: |-
          if [ ! -f package-lock.json ]; then
            echo "::error file=package.json::package-lock.json is not committed. Run npm install, commit package-lock.json, and push."
            exit 1
          fi
          npm ci --ignore-scripts
      - name: Generate code index
        id: generate_code_index
        if: steps.changes.outputs.run == 'true'
        run: npx projen codeindex
      - name: Commit code index
        id: commit_code_index
        if: steps.changes.outputs.run == 'true'
        uses: xpertss/auto-commit@v0.0.4
        with:
          commit_message: "chore: update code index"
          folder: .xss
          if_behind: skip
concurrency:
  group: codeindex
  cancel-in-progress: true
