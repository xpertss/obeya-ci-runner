# Purpose: Deploy the CDK app on every push to main via the org-wide gha-cdk-deploy OIDC role.

name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gha-cdk-deploy
          aws-region: us-east-2
      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        id: install
        run: npm ci
      - name: cdk deploy
        id: cdk_deploy
        run: npx cdk deploy --all --require-approval never
